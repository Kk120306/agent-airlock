name: Release proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  quality:
    name: Quality and release audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run project checks
        run: npm run check

      - name: Reject known dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit the release boundary
        run: npm run audit:release

  browser-proof:
    name: Production browser proof
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install the required Google Chrome runtime
        run: npx playwright install --with-deps chrome

      - name: Prove the starter journey
        run: npm run test:e2e

      - name: Prove the judge safety loop
        run: npm run test:demo:e2e

      - name: Prove portable trust in the production UI
        run: npm run test:phase11:ui

      - name: Prove two-instance federated admission
        run: npm run test:phase12:real

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-proof-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  real-runtime-proof:
    name: Real CodeJam Runtime proof
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install the required Google Chrome runtime
        run: npx playwright install --with-deps chrome

      - name: Prove the production image boundary
        env:
          PRODUCTION_IMAGE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/agent-airlock-production-image
        run: |
          LAUNCHPAD_ENV_FILE=.env.example docker compose config --quiet
          bash scripts/check-phase-eleven-docker.sh

      - name: Preserve the exact tested production image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-airlock-production-image
          path: |
            ${{ runner.temp }}/agent-airlock-production-image/agent-airlock-production-image.tar
            ${{ runner.temp }}/agent-airlock-production-image/agent-airlock-production-image-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Build and prove browser to real Runtime to Promotion
        run: npm run check:phase13:runtime

      - name: Record a fresh self-verifying Runtime safety proof
        run: npm run prove:runtime -- --reset --json

      - name: Resolve the exact verified artifact pair
        id: runtime-proof-artifacts
        run: node scripts/resolve-runtime-proof-artifacts.mjs --github-output "$GITHUB_OUTPUT"

      - name: Preserve verified Runtime proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-runtime-verified-artifacts
          path: |
            ${{ steps.runtime-proof-artifacts.outputs.result_path }}
            ${{ steps.runtime-proof-artifacts.outputs.chain_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-runtime-proof-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  production-image-replay:
    name: Fresh-runner production image replay
    needs: real-runtime-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the exact tested production image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-airlock-production-image
          path: ${{ runner.temp }}/agent-airlock-production-image

      - name: Replay the retained image on the fresh Docker engine
        env:
          PRODUCTION_IMAGE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/agent-airlock-production-image
        run: |
          docker info >/dev/null
          PROVENANCE_PATH="$PRODUCTION_IMAGE_ARTIFACT_DIRECTORY/agent-airlock-production-image-provenance.json"
          IMAGE_ID="$(node -e 'const fs=require("node:fs");const file=process.argv[1];const metadata=fs.lstatSync(file);if(!metadata.isFile()||metadata.isSymbolicLink()||metadata.size<1||metadata.size>1048576)process.exit(1);const proof=JSON.parse(fs.readFileSync(file,"utf8"));const id=proof?.image?.id;if(proof?.schema!=="agent-airlock-production-image-provenance/v1"||!/^sha256:[a-f0-9]{64}$/.test(id))process.exit(1);process.stdout.write(id)' "$PROVENANCE_PATH")"
          if docker image inspect "$IMAGE_ID" >/dev/null 2>&1; then
            echo "The retained production image was already present before replay." >&2
            exit 1
          fi
          node scripts/production-image-provenance.mjs \
            --verify "$PROVENANCE_PATH" \
            --artifact-directory "$PRODUCTION_IMAGE_ARTIFACT_DIRECTORY"
          LOADED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE_ID")"
          if [ "$LOADED_IMAGE_ID" != "$IMAGE_ID" ]; then
            echo "Fresh-runner replay did not load the exact retained image ID." >&2
            exit 1
          fi
