name: Release proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  quality:
    name: Quality and release audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run project checks
        run: npm run check

      - name: Reject known dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit the release boundary
        run: npm run audit:release

  browser-proof:
    name: Production browser proof
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install the pinned browser runtime
        run: npx playwright install --with-deps chromium

      - name: Prove the starter journey
        run: npm run test:e2e

      - name: Prove the judge safety loop
        run: npm run test:demo:e2e

      - name: Prove portable trust in the production UI
        run: npm run test:phase11:ui

      - name: Prove two-instance federated admission
        run: npm run test:phase12:real

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-proof-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  real-runtime-proof:
    name: Real CodeJam Runtime proof
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install the pinned browser runtime
        run: npx playwright install --with-deps chromium

      - name: Build and prove browser to real Runtime to Promotion
        run: npm run check:phase13:runtime

      - name: Record a fresh self-verifying Runtime safety proof
        run: npm run prove:runtime -- --reset --json

      - name: Resolve the exact verified artifact pair
        id: runtime-proof-artifacts
        run: node scripts/resolve-runtime-proof-artifacts.mjs --github-output "$GITHUB_OUTPUT"

      - name: Preserve verified Runtime proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-runtime-verified-artifacts
          path: |
            ${{ steps.runtime-proof-artifacts.outputs.result_path }}
            ${{ steps.runtime-proof-artifacts.outputs.chain_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-runtime-proof-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
